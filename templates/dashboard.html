<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Insight — Dashboard</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav>
    <span class="logo">💰 Finance Insight</span>
    <a href="/">Upload</a>
    <a href="/transactions">Transactions</a>
    <a href="/dashboard" class="active">Dashboard</a>
  </nav>

  <main class="container">
    <h1>Financial Dashboard</h1>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card income">
        <div class="kpi-label">Total Income</div>
        <div class="kpi-value" id="kpiIncome">—</div>
      </div>
      <div class="kpi-card expense">
        <div class="kpi-label">Total Expenses</div>
        <div class="kpi-value" id="kpiExpense">—</div>
      </div>
      <div class="kpi-card savings">
        <div class="kpi-label">Net Savings</div>
        <div class="kpi-value" id="kpiSavings">—</div>
      </div>
      <div class="kpi-card top">
        <div class="kpi-label">Top Expense Category</div>
        <div class="kpi-value" id="kpiTop">—</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="card">
        <h2>Expenses by Category</h2>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="card">
        <h2>Category Breakdown</h2>
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <p id="emptyDash" class="empty-msg hidden">No data yet. <a href="/">Upload a CSV first.</a></p>
  </main>

  <script>
    const fmt = v => '₹' + Number(v).toLocaleString('en-IN', {maximumFractionDigits:2});
    const COLORS = [
      '#6366f1','#f59e0b','#10b981','#ef4444','#3b82f6',
      '#ec4899','#8b5cf6','#14b8a6','#f97316','#84cc16','#06b6d4','#a78bfa'
    ];

    async function loadDashboard() {
      const data = await fetch('/api/summary').then(r => r.json());
      const cats = Object.keys(data.by_category);

      if (!cats.length) {
        document.getElementById('emptyDash').classList.remove('hidden');
        return;
      }

      document.getElementById('kpiIncome').textContent  = fmt(data.income);
      document.getElementById('kpiExpense').textContent = fmt(data.expense);
      const savings = data.income - data.expense;
      const savEl = document.getElementById('kpiSavings');
      savEl.textContent = fmt(Math.abs(savings));
      savEl.style.color = savings >= 0 ? '#10b981' : '#ef4444';
      if (savings < 0) savEl.textContent = '-' + savEl.textContent;
      document.getElementById('kpiTop').textContent = data.top_category || '—';

      const values = cats.map(c => data.by_category[c]);

      // Pie chart
      new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: { labels: cats, datasets: [{ data: values, backgroundColor: COLORS }] },
        options: {
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
        }
      });

      // Bar chart
      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: cats,
          datasets: [{
            label: 'Amount (₹)',
            data: values,
            backgroundColor: COLORS,
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { callback: v => '₹' + v.toLocaleString('en-IN') } } }
        }
      });
    }

    loadDashboard();
  </script>
</body>
</html>
